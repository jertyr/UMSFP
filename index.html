<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
        <div class="login-container">
            <h1>✨ Progress Tracker</h1>
            <p class="login-tagline">Celebrate every step forward</p>
            <button id="google-login-btn" class="btn-google">
                <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Sign in with Google
            </button>
            <p class="login-note">Your data will be securely stored and synced across devices</p>
        </div>
    </div>

    <div class="container" id="main-app" style="display: none;">
        <header>
            <div class="header-content">
                <div>
                    <h1>✨ Your Progress Tracker</h1>
                    <p class="tagline">Celebrate every step forward</p>
                </div>
                <div class="user-menu">
                    <img id="user-avatar" src="" alt="" class="user-avatar">
                    <span id="user-name"></span>
                    <button id="logout-btn" class="btn-logout">Sign Out</button>
                </div>
            </div>
        </header>

        <main id="app">
            <!-- Goals Dashboard -->
            <div id="dashboard" class="view">
                <div class="view-header">
                    <h2>Your Goals</h2>
                    <button class="btn-primary" onclick="showNewGoalForm()">+ New Goal</button>
                </div>
                <div id="goals-list" class="goals-grid"></div>
                <div id="empty-state" class="empty-state" style="display: none;">
                    <p>You haven't set any goals yet.</p>
                    <p>Start your journey by creating your first goal!</p>
                </div>
            </div>

            <!-- New Goal Form -->
            <div id="new-goal-form" class="view" style="display: none;">
                <div class="form-container">
                    <h2>Create a New Goal</h2>
                    <form id="goal-form" onsubmit="saveGoal(event)">
                        <div class="form-group">
                            <label for="goal-title">What's your goal?</label>
                            <input type="text" id="goal-title" placeholder="e.g., Lose weight, Run weekly, Zero outbursts" required>
                        </div>

                        <div class="form-group">
                            <label for="goal-target">Target number</label>
                            <input type="number" id="goal-target" step="0.1" placeholder="e.g., 187" required>
                        </div>

                        <div class="form-group">
                            <label for="goal-direction">Success means...</label>
                            <select id="goal-direction" required>
                                <option value="below">Below or equal to target</option>
                                <option value="above">Above or equal to target</option>
                                <option value="equal">Exactly equal to target</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="goal-start">Starting value (optional)</label>
                            <input type="number" id="goal-start" step="0.1" placeholder="e.g., 217">
                        </div>

                        <div class="form-group">
                            <label for="goal-date">Target date (optional)</label>
                            <input type="date" id="goal-date">
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn-secondary" onclick="cancelGoalForm()">Cancel</button>
                            <button type="submit" class="btn-primary">Create Goal</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Check-in Form -->
            <div id="check-in-form" class="view" style="display: none;">
                <div class="form-container">
                    <h2 id="check-in-title">Weekly Check-in</h2>
                    <form id="checkin-form" onsubmit="saveCheckIn(event)">
                        <div class="form-group">
                            <label id="check-in-label">Current value</label>
                            <input type="number" id="check-in-value" step="0.1" required>
                        </div>

                        <div class="form-group">
                            <label for="check-in-notes">Notes (optional)</label>
                            <textarea id="check-in-notes" rows="3" placeholder="How are you feeling about your progress?"></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn-secondary" onclick="cancelCheckIn()">Cancel</button>
                            <button type="submit" class="btn-primary">Submit Check-in</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Progress View -->
            <div id="progress-view" class="view" style="display: none;">
                <div class="progress-container">
                    <button class="btn-back" onclick="showDashboard()">← Back to Dashboard</button>
                    <div id="progress-content"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- App Configuration and Logic -->
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
